<svg xmlns="http://www.w3.org/2000/svg" width="260" height="200" viewBox="0 0 260 200">
  <!-- cursor line (black bar) -->
  <line x1="80" y1="10" x2="80" y2="180" stroke="#000" stroke-width="2" />

  <!-- optional blue marker at baseline (like the chart point) -->
  <circle cx="80" cy="180" r="3" fill="#2563eb"/>

  <!-- tooltip group -->
  <g transform="translate(95,40)">
    <!-- subtle shadow -->
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12"/>
      </filter>
    </defs>

    <!-- tooltip container -->
    <rect x="0" y="0" rx="8" ry="8" width="140" height="58"
          fill="#ffffff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>

    <!-- blue dot -->
    <circle cx="14" cy="20" r="5" fill="#2563eb"/>

    <!-- text lines -->
    <text x="28" y="24" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
          font-size="14" fill="#111827">Visitors <tspan font-weight="600">0</tspan></text>

    <text x="14" y="42" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
          font-size="12" fill="#6b7280">Aug 31</text>
  </g>
</svg>
